<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Run a late-night taco stand outside the bars on Main Street. 20 levels, three languages.">
<meta name="theme-color" content="#0b0f2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taco Nights">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Taco Nights</title>
<style>
/* Single committed look: a neon-lit night street. Dark everywhere, by choice. */
:root{--acc:#ffd60a;--pink:#ff2d95;--cyan:#2ee6ff;--lime:#b6ff3b;--panel:#1e2a2f;--panel2:#15202a;--bg:#07080f;--fg:#fff;color-scheme:dark}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080f;font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;overflow:hidden;color:#fff;touch-action:manipulation;overscroll-behavior:none}
#rotate{position:fixed;inset:0;background:#07080f;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-weight:700}
#rotate .ph{width:46px;height:80px;border:4px solid var(--acc);border-radius:10px;animation:rot 1.6s ease-in-out infinite alternate}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(-90deg)}}
#moneyPill{background:linear-gradient(90deg,#2d6a3f var(--fill,0%),#1c2033 var(--fill,0%));transition:background .3s}
#moneyPill.hit{border-color:#5ad36a;box-shadow:0 0 10px #5ad36a66}
#goalBanner{position:absolute;left:50%;top:62px;transform:translateX(-50%);background:#1f3a2a;border:1px solid #5ad36a;color:#8ff5a0;border-radius:999px;padding:6px 16px;font-weight:700;font-size:13px;z-index:6;cursor:pointer;display:none;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#goalBanner.show{display:block;animation:dropin .4s ease-out}
@keyframes dropin{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.rating{color:var(--acc);font-size:12px;letter-spacing:1px;line-height:1}
.rating.dim{color:#434a75}
.lvl .rating{font-size:9px;display:block;margin-top:-2px}
.bigstars{font-size:40px;color:var(--acc);letter-spacing:4px;margin:4px 0}
.bigstars .off{color:#434a75}
.namerow{display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0 10px;flex-wrap:wrap}
.namerow input{background:#1c2033;border:1px solid #434a75;color:#fff;border-radius:10px;padding:9px 12px;font-size:15px;font-weight:700;width:200px;text-align:center}
.namerow input:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.namerow .ok{color:#8ff5a0;font-weight:700;font-size:14px}
.board{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px;font-variant-numeric:tabular-nums}
.board th{font-size:11px;letter-spacing:1px;text-transform:uppercase;opacity:.6;padding:6px 8px;text-align:left}
.board td{padding:7px 8px;border-top:1px solid #262b45;text-align:left}
.board td.n,.board th.n{text-align:right}
.board tr.me td{background:#2a2410;color:var(--acc)}
.board td.rank{opacity:.6;width:34px}
.board .st{color:var(--acc);letter-spacing:1px}
.boardwrap{max-height:300px;overflow:auto;border:1px solid #262b45;border-radius:12px}
.bnote{font-size:12px;opacity:.65;margin:4px 0 10px}
.he .board th,.he .board td{text-align:right}.he .board td.n,.he .board th.n{text-align:left}
button{font-family:inherit}
#game{position:absolute;left:50%;top:50%;width:1100px;height:700px;transform-origin:center;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);background:#0b0f2a}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;background:linear-gradient(#141827,#0c0f1c);border-bottom:2px solid var(--pink);z-index:5}
.pill{background:#1c2033;border:1px solid #33395a;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.pill small{opacity:.6;font-weight:600;font-size:12px}
#timeWrap{flex:1;height:14px;background:#1c2033;border-radius:999px;overflow:hidden;border:1px solid #33395a;min-width:80px}
#timeBar{height:100%;background:linear-gradient(90deg,var(--acc),var(--pink));width:100%}
.hbtn{background:#262b45;border:1px solid #434a75;color:#fff;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.hbtn:hover{background:#333a5e}
#radioBtn.on{background:var(--acc);color:#2a1a00;border-color:#fff1a8;animation:pulse 1s infinite}
#radioBtn:disabled{opacity:.4;cursor:default;animation:none}
#strikes{display:flex;gap:4px}
#strikes i{width:16px;height:16px;border-radius:50%;background:#33395a;display:inline-block;border:2px solid #434a75}
#strikes i.on{background:#ff3b4a;border-color:#ff8a8e;box-shadow:0 0 8px #ff3b4a}

/* ---------- Street ---------- */
#street{position:absolute;left:0;top:56px;right:0;height:300px;overflow:hidden;background:#1a1448}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#scene .bulbs{animation:twinkle 1.4s infinite alternate}
/* the cart's own striped canopy, seen from behind the counter */
.canopy{position:absolute;left:0;right:0;top:0;height:24px;background:repeating-linear-gradient(90deg,#d7263d 0 48px,#f7f1e3 48px 96px);z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.55)}
.canopy:after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 24px 0,#f7f1e3 0 9px,transparent 10px) 48px 0/96px 10px,radial-gradient(circle at 24px 0,#d7263d 0 9px,transparent 10px) 0 0/48px 10px}
.canopy span{position:absolute;left:50%;top:2px;transform:translateX(-50%);background:#1b1b2e;color:var(--acc);padding:1px 14px;border-radius:8px;font-weight:900;letter-spacing:3px;font-size:12px;border:2px solid var(--acc);text-shadow:0 0 8px var(--acc);white-space:nowrap}
.lights{position:absolute;left:0;right:0;top:38px;height:14px;background:radial-gradient(circle at 50% 50%,#fff3b0 0 3px,transparent 4px) 0 0/40px 14px;z-index:3;animation:twinkle 1.6s infinite alternate}
.post{position:absolute;top:22px;bottom:0;width:14px;background:linear-gradient(90deg,#4a141c,#a12a3a 45%,#4a141c);z-index:3;box-shadow:2px 0 6px rgba(0,0,0,.5)}
.post.l{left:18px}.post.r{right:18px}
#counterEdge{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,transparent 0 118px,#4a2a10 118px 120px),linear-gradient(#a8743a,#6b4320);z-index:4;box-shadow:0 -4px 14px rgba(0,0,0,.6)}

.cust{position:absolute;bottom:14px;width:180px;height:260px;cursor:pointer;z-index:2;transition:transform .15s}
.cust:hover .avatar{transform:translateY(-3px)}
.cust.enter{animation:walkin .5s ease-out}
.cust.out{animation:leaveHappy .55s forwards;pointer-events:none}
.cust.storm{animation:storm .7s forwards;pointer-events:none}
.cust.angry .avatar{animation:tremble .22s infinite}
.cust.shake{animation:shake .4s}
.avatar{position:absolute;bottom:0;left:50px;width:80px;height:100px;transition:transform .15s}
.meter{position:absolute;left:52px;bottom:108px;width:76px;height:9px;background:rgba(0,0,0,.55);border-radius:5px;border:1px solid rgba(255,255,255,.35)}
.meter i{display:block;height:100%;border-radius:5px;background:#5ad36a;width:100%}
.bubble{position:absolute;left:0;right:0;top:0;background:#fff8ec;color:#222;border-radius:14px;padding:8px 8px 6px;box-shadow:0 6px 16px rgba(0,0,0,.5);min-height:70px}
.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#fff8ec;border-bottom:0}
.oline{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.cname{font-size:11px;font-weight:700;opacity:.55;text-align:center;margin-top:4px}
.oitems{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:6px}

/* ---------- Ingredient chips ---------- */
.ing{width:40px;height:40px;position:relative;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.ing svg{width:100%;height:100%;display:block;overflow:visible}
.ing.sm{width:28px;height:28px}
.ing b{position:absolute;right:-7px;bottom:-7px;background:#222;color:#fff;border-radius:999px;font-size:11px;line-height:1;padding:3px 5px;border:2px solid #fff;font-weight:800}
.lvls{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:8px auto 12px;max-width:560px}
.lvl{height:36px;border-radius:8px;border:1px solid #434a75;background:#1c2033;color:#fff;font-weight:800;cursor:pointer;font-size:14px}
.lvl:hover{border-color:var(--acc)}
.lvl.locked{opacity:.3;cursor:default}
.lvl.cur{background:var(--acc);color:#2a1a00;border-color:#fff1a8}
.lvl.done{background:#1f3a2a;border-color:#3f7a52;color:#8ff5a0}

.bicon{display:inline-block;flex:none}
.bicon.corn{border-radius:50%;width:34px;height:34px;background:radial-gradient(circle at 40% 35%,#ffe28a,#e0a93c);border:2px solid #b8832a}
.bicon.flour{border-radius:50%;width:38px;height:38px;background:radial-gradient(circle at 40% 35%,#fff4dc,#e9cfa0);border:2px solid #c9a46f;box-shadow:inset 0 0 0 3px #f7e7c8}
.bicon.crunchy{width:44px;height:26px;border-radius:0 0 22px 22px;background:linear-gradient(#f5c04a,#c98a1c);border:2px solid #9a6410;border-top:0}
.bicon.sm.corn{width:26px;height:26px}
.bicon.sm.flour{width:28px;height:28px}
.bicon.sm.crunchy{width:34px;height:20px}

/* ---------- Counter ---------- */
/* the cart body: painted red metal with dark steel work surfaces set into it */
#counter{position:absolute;left:0;top:356px;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent 0 60px,rgba(0,0,0,.12) 60px 62px),linear-gradient(#a3202f,#7d1824);border-top:10px solid #c9c2b4;display:grid;grid-template-columns:300px 380px 1fr;gap:8px;padding:8px}
.zone{position:relative;background:linear-gradient(#2a3a3f,#1b272c);border-radius:12px;border:2px solid #0f1619;box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.ztitle{position:absolute;top:8px;left:12px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#d8dde3;opacity:.7;font-weight:700;z-index:1}

#meats{position:absolute;left:12px;top:32px;display:flex;flex-direction:column;gap:8px}
.meatbin{width:120px;height:88px;border-radius:12px;cursor:pointer;background:var(--panel);border:2px solid #3b4a52;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:700;color:#e3e8ee;transition:border-color .15s,transform .1s}
.meatbin:hover{border-color:var(--acc);transform:translateY(-2px)}
.meatbin.locked{opacity:.3;pointer-events:none}
.meatbin .ing{width:42px;height:42px}
.meatbin.sizzle{animation:bump .25s}

#plancha{position:absolute;left:142px;top:32px;width:146px;height:280px;background:#1b1f24;border-radius:10px;border:3px solid #4a525b;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;box-shadow:inset 0 0 24px rgba(0,0,0,.8),0 0 18px #ff6a1a44}
#plancha:before{content:"";position:absolute;left:8px;right:8px;bottom:-2px;height:4px;background:linear-gradient(90deg,#ff8a2a,#ffd27a,#ff6a1a);border-radius:2px;box-shadow:0 0 18px #ff7a1a;animation:heat 1.4s infinite alternate}
.pslot{border-radius:10px;background:#111419;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.portion{width:56px;height:56px;border-radius:50%;cursor:pointer;background:conic-gradient(var(--c) var(--p),#2c3139 0);display:flex;align-items:center;justify-content:center;transition:box-shadow .2s}
.portion .ing{width:42px;height:42px}
.portion.raw .ing{filter:saturate(.5) brightness(1.3)}
.portion.ready{box-shadow:0 0 16px #5ad36a}
.portion.burnt .ing{filter:brightness(.2)}
.portion.burnt{box-shadow:0 0 12px #000}
.plabel{font-size:10px;font-weight:700;color:#c9cdd8;text-transform:uppercase;letter-spacing:1px}
.pslot .plabel.raw{color:#f5a4c0}.pslot .plabel.ready{color:#8ff5a0}.pslot .plabel.burnt{color:#ff7b7b}

#breads{position:absolute;left:14px;top:34px;display:flex;flex-direction:column;gap:9px}
.bread{width:98px;height:84px;border-radius:12px;cursor:pointer;background:var(--panel);border:2px solid #3b4a52;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;color:#e3e8ee;transition:border-color .15s,transform .1s}
.bread:hover{border-color:var(--acc);transform:translateY(-2px)}
.bread.locked{opacity:.3;pointer-events:none}
.bread small{color:var(--acc);font-weight:600}
#handArea{position:absolute;left:124px;top:34px;width:160px;display:flex;flex-direction:column;align-items:center}
#wrap{width:150px;height:190px;border-radius:50% 50% 30px 30px;background:#2a353b;border:3px dashed #58656d;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px;padding:26px 12px 10px;position:relative;transition:box-shadow .2s}
#wrap.corn{background:radial-gradient(circle at 40% 30%,#ffe28a,#e0a93c);border:3px solid #b8832a;border-radius:50%;height:160px;margin-top:15px;padding-top:34px}
#wrap.flour{background:radial-gradient(circle at 40% 30%,#fff4dc,#e9cfa0);border:3px solid #c9a46f;border-radius:50%;height:170px;margin-top:10px;padding-top:36px}
#wrap.crunchy{background:linear-gradient(#f5c04a,#c98a1c);border:3px solid #9a6410;border-top:0;border-radius:0 0 75px 75px;height:150px;margin-top:20px;padding-top:14px}
#wrap.ready{box-shadow:0 0 0 4px #5ad36a,0 0 34px #5ad36a;animation:pulse 1s infinite}
#wrap.ruined{box-shadow:0 0 0 4px #ff3b4a,0 0 24px #ff3b4a}
#wrap .ing{width:34px;height:34px}
#wrap .ing b{font-size:10px}
#wrap .hint{color:#c9cdd8;font-size:12px;text-align:center;align-self:center;width:100%;margin-top:40px;opacity:.6}
#handStatus{margin-top:10px;font-size:13px;font-weight:700;text-align:center;min-height:38px;color:#fff;line-height:1.3}
#handStatus.ok{color:#8ff5a0}#handStatus.bad{color:#ff7b7b}
#trash{position:absolute;right:16px;top:70px;width:66px;height:110px;cursor:pointer;text-align:center}
#trash .lid{width:66px;height:12px;background:linear-gradient(#5d6577,#39404d);border-radius:6px 6px 2px 2px;margin:0 auto;transition:transform .15s;transform-origin:left bottom}
#trash .bin{width:54px;height:66px;margin:2px auto 0;background:repeating-linear-gradient(90deg,#4a5162 0 10px,#3a404e 10px 14px),#4a5162;border-radius:6px 6px 12px 12px;border:2px solid #272b35}
#trash:hover .lid{transform:rotate(-18deg)}
#trash .label{font-size:11px;font-weight:700;color:#c9cdd8;margin-top:6px}
#trash.drop .bin{animation:bump .25s}

#trays{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:absolute;left:12px;top:32px;right:12px}
.tray{background:var(--panel);border:2px solid #3b4a52;border-radius:12px;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;transition:border-color .15s,transform .1s}
.tray:hover{border-color:var(--acc);transform:translateY(-2px)}
.tray .ing{width:44px;height:44px}
.tray .tname{font-size:9px;font-weight:700;color:#e3e8ee;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tray .stock{font-size:11px;color:var(--acc);font-weight:700}
.tray.empty{opacity:.45}
.tray.locked{opacity:.25;pointer-events:none}
.tray.buzz{border-color:#ff3b4a}
.flies{position:absolute;inset:0;pointer-events:none;z-index:2}
.flies i{position:absolute;width:7px;height:7px;background:#111;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.25);animation:fly 1.1s infinite alternate ease-in-out}
.flies i:nth-child(1){left:20%;top:20%}
.flies i:nth-child(2){left:60%;top:35%;animation-delay:-.4s;animation-duration:.9s}
.flies i:nth-child(3){left:40%;top:60%;animation-delay:-.7s;animation-duration:1.3s}
#tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px}
.tool{flex:1;height:70px;border-radius:12px;background:var(--panel);border:2px solid #3b4a52;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px;color:#e3e8ee;font-weight:700;font-size:13px;position:relative;overflow:hidden;text-align:left}
.tool:hover{border-color:var(--acc)}
.tool .ico{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
#supplier .ico{background:var(--acc)}
#fan .ico{background:var(--cyan)}
#fan.spin .ico{animation:spin .6s linear}
.tool .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--acc);width:0}
.tool small{display:block;font-weight:600;opacity:.6;font-size:11px}

/* ---------- Overlay ---------- */
#overlay{position:absolute;inset:0;background:rgba(5,6,20,.86);display:flex;align-items:center;justify-content:center;z-index:20}
#overlay.hidden{display:none}
.card{width:720px;background:#141a2a;border:2px solid var(--pink);border-radius:20px;padding:28px 34px;text-align:center;box-shadow:0 0 40px #ff2d9555,0 20px 60px rgba(0,0,0,.6)}
.card h1{font-size:48px;margin:0;color:var(--acc);letter-spacing:2px;font-weight:900;text-shadow:0 0 14px #ffd60a88}
.card h2{font-size:30px;margin:0 0 6px;color:var(--acc)}
.card .sub{opacity:.75;margin:6px 0 18px;font-size:16px}
.big{font-size:18px;padding:12px 30px;background:var(--acc);color:#2a1a00;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin:6px}
.big:hover{background:#ffe566}
.ghost{font-size:15px;padding:10px 20px;background:transparent;color:#fff;border:1px solid #434a75;border-radius:12px;font-weight:700;cursor:pointer;margin:6px}
.ghost:hover{background:#262b45}
.steps{text-align:left;margin:0 auto 10px;padding:0;list-style:none;font-size:13px;line-height:1.35;max-width:640px}
.steps li{display:flex;gap:10px;margin:4px 0;align-items:flex-start}
.steps li span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--pink);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:#1c2033;border-radius:12px;padding:10px}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;opacity:.7}
.verdict{font-size:18px;font-weight:800;margin:8px 0}
.verdict.good{color:#8ff5a0}.verdict.bad{color:#ff7b7b}
.crown{font-size:70px;line-height:1}

.float{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 4px #000,0 0 8px rgba(0,0,0,.6);animation:floatUp 1.1s forwards;pointer-events:none;z-index:15;white-space:nowrap;transform:translateX(-50%)}
.float.bad{color:#ff7b7b}.float.good{color:#8ff5a0}.float.gold{color:var(--acc)}
.note{position:absolute;font-size:22px;color:var(--acc);animation:floatUp 1.6s forwards;pointer-events:none;z-index:15}

.he .bubble,.he .card,.he #handStatus,.he .tool,.he .pill{direction:rtl}
.he .steps,.he .tool{text-align:right}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
@keyframes heat{from{opacity:.75}to{opacity:1}}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
@keyframes walkin{from{transform:translateX(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes leaveHappy{to{transform:translateX(90px) translateY(-10px);opacity:0}}
@keyframes storm{0%{transform:none}20%{transform:translateX(-8px) rotate(-4deg)}40%{transform:translateX(8px) rotate(4deg)}100%{transform:translateX(-160px);opacity:0}}
@keyframes tremble{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bump{50%{transform:scale(1.08)}}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(9px,-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-60px}}
</style>
</head>
<body>
<div id="game">

  const t = (n - 1) / (MAX_LEVEL - 1);

// ---------- Leaderboard ----------
// Shared scores live in a Google Sheet behind an Apps Script web app (leaderboard/Code.gs, README).
// Paste that deployment's URL here. Empty = scores stay on this device only.
const LEADERBOARD_URL = '';
let playerName = '', playerId = '', localScores = {}, boardCache = null, submittedLevel = 0;
try {
  playerName = localStorage.getItem('tacos.name') || '';
  playerId = localStorage.getItem('tacos.id') || '';
  localScores = JSON.parse(localStorage.getItem('tacos.scores') || '{}') || {};
} catch (e) {}
if (!playerId) { playerId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { localStorage.setItem('tacos.id', playerId); } catch (e) {} }
const cleanName = s => String(s || '').replace(/[<>]/g, '').trim().slice(0, 20);
function recordLocal(level, earned, stars) {
  const cur = localScores[level];
  if (!cur || earned > cur.earned) { localScores[level] = { earned, stars }; try { localStorage.setItem('tacos.scores', JSON.stringify(localScores)); } catch (e) {} }
}
async function submitScore(level, earned, stars) {
  if (!LEADERBOARD_URL || !playerName || submittedLevel === level) return false;
  submittedLevel = level;
  try {
    // text/plain keeps the request "simple" (no CORS preflight), which Apps Script requires.
    await fetch(LEADERBOARD_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id: playerId, name: playerName, level, earned, stars }) });
    boardCache = null; return true;
  } catch (e) { submittedLevel = 0; return false; }
}
async function fetchBoardRows() {
  if (!LEADERBOARD_URL) return null;
  if (boardCache && Date.now() - boardCache.t < 30000) return boardCache.rows;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const r = await fetch(LEADERBOARD_URL, { redirect: 'follow', signal: ctrl.signal });
    const rows = await r.json(); boardCache = { t: Date.now(), rows }; return rows;
  } finally { clearTimeout(timer); }
}
// One row per player: best earnings per level summed, levels cleared, stars; latest name wins.
function aggregate(rows) {
  const by = {};
  for (const r of rows) {
    const id = String(r.id || ''), level = +r.level | 0, earned = +r.earned | 0, stars = +r.stars | 0;
    if (!id || level < 1) continue;
    const p = by[id] || (by[id] = { id, name: '', best: {} });
    if (r.name) p.name = cleanName(r.name);
    const b = p.best[level]; if (!b || earned > b.earned) p.best[level] = { earned, stars: Math.max(stars, b ? b.stars : 0) };
  }
  return Object.values(by).map(p => {
    const lv = Object.values(p.best);
    return { id: p.id, name: p.name || '?', total: lv.reduce((s, x) => s + x.earned, 0), levels: lv.filter(x => x.stars > 0).length, stars: lv.reduce((s, x) => s + x.stars, 0) };
  }).sort((a, b) => b.total - a.total || b.stars - a.stars);
}
function myRows() { return Object.entries(localScores).map(([level, s]) => ({ id: playerId, name: playerName || T('you'), level: +level, earned: s.earned, stars: s.stars })); }

// ---------- Day flow ----------
function startDay(n) {
  day = n; lvl = levelCfg(n);
  dayEarned = 0; timeLeft = lvl.dayLength; spawnTimer = 1.2; strikes = 0; tokens = 0; tokensGiven = 0; radioLeft = 0; delivery = 0; flies = null; flyTimer = lvl.flyEvery || 0;
  stats = { served: 0, lost: 0, tips: 0, waste: 0, trashed: 0 };
  goalShown = false; $('#goalBanner').classList.remove('show');
  customers.forEach(c => c.el.remove()); customers = [];
  portions.forEach((p, i) => removePortion(i)); hand = null;
  TOPS.forEach(k => stock[k] = MAX_STOCK);

function endDay() {
  if (state !== 'play') return;

  if (dayEarned > bestDay) { bestDay = dayEarned; try { localStorage.setItem('tacos.best', bestDay); } catch (e) {} }
  if (success && day < MAX_LEVEL && unlocked < day + 1) { unlocked = day + 1; try { localStorage.setItem('tacos.unlocked', unlocked); } catch (e) {} }
  const st = success ? starsFor(dayEarned, lvl.target) : 0;
  if (st > (starsByLevel[day] || 0)) { starsByLevel[day] = st; try { localStorage.setItem('tacos.stars', JSON.stringify(starsByLevel)); } catch (e) {} }
  submittedLevel = 0;
  if (success) { recordLocal(day, dayEarned, st); submitScore(day, dayEarned, st); }
  $('#goalBanner').classList.remove('show');
  customers.forEach(c => c.el.remove()); customers = []; if (flies) { $('#tray-' + flies.tray).querySelector('.flies')?.remove(); flies = null; }
  setTimeout(() => showDayEnd(success, tooAngry), 500);
}

  $('#timeBar').style.background = timeLeft < 20 ? '#ff3b4a' : '';
  $$('#strikes i').forEach((i, k) => i.classList.toggle('on', k < strikes));
  $('#tokLbl').textContent = tokens;
  const rb = $('#radioBtn'); rb.disabled = tokens <= 0 || radioLeft > 0 || state !== 'play'; rb.classList.toggle('on', radioLeft > 0);
  customers.forEach(c => {
    c.meter.style.width = (100 * c.patience) + '%';
    c.meter.style.background = c.patience > .55 ? '#5ad36a' : c.patience > .25 ? '#ffd60a' : '#ff3b4a';
    const mood = c.patience > .55 ? 'happy' : c.patience > .25 ? 'meh' : 'angry';
    if (mood !== c.mood) { c.mood = mood; c.mouth.setAttribute('d', MOUTH[mood]); c.brows.setAttribute('opacity', mood === 'angry' ? 1 : 0); c.el.classList.toggle('angry', mood === 'angry'); }
  });
  portions.forEach(p => {
    if (!p) return;
    const st = p.t < RAW_T ? 'raw' : p.t < lvl.burnT ? 'ready' : 'burnt';
    const prog = st === 'raw' ? p.t / RAW_T : st === 'ready' ? (p.t - RAW_T) / (lvl.burnT - RAW_T) : 1;
    p.node.style.setProperty('--p', (prog * 360) + 'deg');
    p.node.style.setProperty('--c', st === 'raw' ? '#f5a4c0' : st === 'ready' ? (prog > .7 ? '#ffd60a' : '#5ad36a') : '#ff3b4a');
    if (st !== p.state) { p.state = st; p.node.className = 'portion ' + st; p.label.className = 'plabel ' + st; p.label.textContent = T(st === 'burnt' ? 'burntL' : st); }
  });
  $('#supplier').querySelector('.prog').style.width = delivery > 0 ? (100 * (1 - delivery / 2.5)) + '%' : '0';
  $('#supSub').textContent = delivery > 0 ? T('delivering') : T('restockAll');
  $('#fanSub').textContent = flies ? T('fliesOn') : T('shooFlies');
  renderStatus();
}

// ---------- Loop ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min(.2, (now - last) / 1000); last = now;
  update(dt);
  requestAnimationFrame(tick);
}
function update(dt) {
  if (state !== 'play') return;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; endDay(); render(); return; }
  if (radioLeft > 0) radioLeft -= dt;
  else {
    spawnTimer -= dt;
    if (spawnTimer <= 0 && customers.length < lvl.maxCustomers) { spawn(); spawnTimer = lvl.spawnEvery * (.75 + Math.random() * .5); }
    customers.slice().forEach(c => { c.patience -= dt / c.maxP; if (c.patience <= 0) leave(c); });
  }
  portions.forEach(p => { if (p) p.t += dt; });
  if (delivery > 0) { delivery -= dt; if (delivery <= 0) { delivery = 0; TOPS.forEach(k => stock[k] = MAX_STOCK); renderTrays(); float($('#supplier'), T('restocked'), 'good'); sfx.cash(); } }
  if (lvl.flyEvery > 0) {
    if (!flies) {
      flyTimer -= dt;
      if (flyTimer <= 0) {
        const k = pick(lvl.toppings); flies = { tray: k, t: 0 };
        const tray = $('#tray-' + k); tray.appendChild(el('div', 'flies', '<i></i><i></i><i></i>')); tray.classList.add('buzz');
        flyTimer = lvl.flyEvery * (.8 + Math.random() * .4);
      }
    } else {
      flies.t += dt;
      if (flies.t > 8 && stock[flies.tray] > 0) { stock[flies.tray] = 0; renderTrays(); float($('#tray-' + flies.tray), T('fliesAte') + ING[flies.tray][lang] + '!', 'bad'); }
    }
  }
  render();
}

// ---------- Street scene ----------
// One-point perspective toward (550,152). z = 0 is the near edge of the street, z = 1 the horizon.
function buildStreet() {
  const VX = 550, VY = 152;
  const L = (a, b, z) => a + (b - a) * z;
  const f2 = v => (+v).toFixed(1);
  const BULBS = ['#ff3b3b', '#3bff6a', '#ffd60a', '#2ee6ff', '#ff2d95'];
  const NEON = ['#ff2d95', '#2ee6ff', '#b6ff3b', '#ffd60a', '#ff7a00'];
  let s = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140f3a"/><stop offset=".55" stop-color="#4a2a7a"/><stop offset="1" stop-color="#e2704a"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3744"/><stop offset="1" stop-color="#1e1c26"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>`;
  s += `<rect width="1100" height="300" fill="url(#sky)"/>`;
  for (let i = 0; i < 50; i++) s += `<circle cx="${rnd(1100)}" cy="${rnd(110)}" r="${f2(Math.random() * 1.1 + .4)}" fill="#fff" opacity="${f2(Math.random() * .6 + .3)}"/>`;
  // distant towers
  s += `<path d="M330 150V70h70v80zM400 150V95h50v55zM520 150V85h60v65zM640 150V105h60v45zM720 150V75h70v75z" fill="#17122c"/>`;
  for (let i = 0; i < 60; i++) s += `<rect x="${335 + rnd(450)}" y="${78 + rnd(66)}" width="3" height="4" fill="#ffd27a" opacity="${f2(Math.random() * .7 + .2)}"/>`;
  // road, sidewalks, curbs, centre line, light trails
  s += `<polygon points="150,300 950,300 562,152 538,152" fill="url(#road)"/>`;
  s += `<polygon points="0,255 0,300 150,300 538,152" fill="#5a5664"/><polygon points="1100,255 1100,300 950,300 562,152" fill="#5a5664"/>`;
  s += `<line x1="150" y1="300" x2="538" y2="152" stroke="#8d8997" stroke-width="2"/><line x1="950" y1="300" x2="562" y2="152" stroke="#8d8997" stroke-width="2"/>`;
  s += `<line x1="544" y1="300" x2="550" y2="152" stroke="#e5b13a" stroke-width="2"/><line x1="556" y1="300" x2="550" y2="152" stroke="#e5b13a" stroke-width="2"/>`;
  s += `<polygon points="290,300 420,300 548,158 544,158" fill="#fff" opacity=".5" filter="url(#blur)"/><polygon points="680,300 810,300 556,158 552,158" fill="#ff3b3b" opacity=".55" filter="url(#blur)"/>`;
  // facades: wall top runs (0,0)->(538,138), wall base (0,255)->(538,152)
  const wx = z => L(0, 538, z), wy = (z, f) => L(L(0, 138, z), L(255, 152, z), f);
  const quad = (z1, z2, f1, f2_, m) => `${f2(m(wx(z1)))},${f2(wy(z1, f1))} ${f2(m(wx(z2)))},${f2(wy(z2, f1))} ${f2(m(wx(z2)))},${f2(wy(z2, f2_))} ${f2(m(wx(z1)))},${f2(wy(z1, f2_))}`;
  for (const side of [-1, 1]) {
    const m = x => side < 0 ? x : 1100 - x;
    s += `<polygon points="${f2(m(0))},0 ${f2(m(0))},255 ${f2(m(538))},152 ${f2(m(538))},138" fill="${side < 0 ? '#3a1d18' : '#331a16'}"/>`;
    // brick course lines
    for (let f = .05; f < 1; f += .05) s += `<line x1="${f2(m(0))}" y1="${f2(wy(0, f))}" x2="${f2(m(538))}" y2="${f2(wy(1, f))}" stroke="#000" stroke-opacity=".12" stroke-width="1"/>`;
    let k = 0;
    for (let z = .02; z < .8; z += .06, k++) {
      const z2 = z + .042;
      // two rows of windows
      for (const [a, b] of [[.12, .3], [.4, .58]]) {
        const lit = Math.random() < .7;
        s += `<polygon points="${quad(z, z2, a, b, m)}" fill="${lit ? '#ffc97a' : '#241410'}" stroke="#120806" stroke-width="${f2(L(3, .5, z))}" opacity="${lit ? f2(Math.random() * .35 + .6) : 1}"/>`;
      }
      // ground floor: a bar front with a neon sign every other building, a door otherwise
      if (k % 2 === 0) {
        s += `<polygon points="${quad(z, z2, .72, 1, m)}" fill="#ffb86b" opacity=".35"/>`;
        const c = NEON[k / 2 % NEON.length];
        s += `<polygon points="${quad(z + .006, z2 - .006, .63, .7, m)}" fill="none" stroke="${c}" stroke-width="${f2(L(2.5, .6, z))}" filter="url(#glow)"/><polygon points="${quad(z + .006, z2 - .006, .63, .7, m)}" fill="none" stroke="${c}" stroke-width="${f2(L(1.5, .4, z))}"/>`;
      } else {
        s += `<polygon points="${quad(z + .01, z2 - .01, .74, 1, m)}" fill="#20110c" stroke="#120806" stroke-width="1"/>`;
      }
    }
    // street trees with fairy lights
    for (const z of [.12, .3, .48, .64]) {
      const r = L(34, 5, z), cx = m(L(70, 538, z)), cy = L(236, 154, z) - r;
      s += `<rect x="${f2(cx - L(3, .5, z))}" y="${f2(cy)}" width="${f2(L(6, 1, z))}" height="${f2(r + L(14, 2, z))}" fill="#2a1a10"/>`;
      s += `<circle cx="${f2(cx)}" cy="${f2(cy)}" r="${f2(r)}" fill="#1f4a2a"/><circle cx="${f2(cx - r * .3)}" cy="${f2(cy - r * .25)}" r="${f2(r * .55)}" fill="#2b6236"/>`;
      for (let i = 0, n = Math.round(L(14, 2, z)); i < n; i++) { const a = Math.random() * Math.PI * 2, d = Math.random() * r * .9; s += `<circle cx="${f2(cx + Math.cos(a) * d)}" cy="${f2(cy + Math.sin(a) * d)}" r="${f2(L(1.6, .5, z))}" fill="#fff3b0"/>`; }
    }
  }
  // the arches, far to near so the near ones overlap
  const zs = [.82, .74, .64, .52, .38, .22, .05];
  zs.forEach((z, idx) => {
    const xl = L(150, 538, z), xr = L(950, 562, z), baseY = L(132, 150, z), ground = L(300, 152, z);
    const cx = (xl + xr) / 2, rx = (xr - xl) / 2, ry = L(82, 5, z), thick = L(14, 1.5, z);
    const pw = L(10, 1.5, z);
    s += `<rect x="${f2(xl - pw / 2)}" y="${f2(baseY)}" width="${f2(pw)}" height="${f2(ground - baseY)}" fill="#141414"/><rect x="${f2(xr - pw / 2)}" y="${f2(baseY)}" width="${f2(pw)}" height="${f2(ground - baseY)}" fill="#141414"/>`;
    const arc = (r) => `M${f2(xl)} ${f2(baseY)} A${f2(rx)} ${f2(r)} 0 0 1 ${f2(xr)} ${f2(baseY)}`;
    s += `<path d="${arc(ry + thick)}" fill="none" stroke="#161616" stroke-width="${f2(L(5, 1, z))}"/><path d="${arc(ry)}" fill="none" stroke="#161616" stroke-width="${f2(L(5, 1, z))}"/>`;
    // zig-zag truss lattice between the two chords
    const n = Math.round(L(26, 6, z)); let lat = '';
    for (let i = 0; i <= n; i++) {
      const a1 = Math.PI - Math.PI * i / n, a2 = Math.PI - Math.PI * (i + 1) / n;
      const p1 = `${f2(cx + rx * Math.cos(a1))},${f2(baseY - (ry + thick) * Math.sin(a1))}`;
      const p2 = `${f2(cx + rx * Math.cos(a2))},${f2(baseY - ry * Math.sin(a2))}`;
      lat += (i ? 'L' : 'M') + p1 + 'L' + p2;
    }
    s += `<path d="${lat}" fill="none" stroke="#2a2a2a" stroke-width="${f2(L(2.5, .6, z))}"/>`;
    // bulbs hanging from the lower chord
    const nb = Math.round(L(30, 7, z)), br = L(4.2, 1.1, z); let bulbs = '', glow = '';
    for (let i = 0; i <= nb; i++) {
      const a = Math.PI - Math.PI * i / nb, bx = cx + rx * Math.cos(a), by = baseY - (ry - L(7, 1, z)) * Math.sin(a), c = BULBS[(i + idx) % BULBS.length];
      glow += `<circle cx="${f2(bx)}" cy="${f2(by)}" r="${f2(br * 2.2)}" fill="${c}" opacity=".45"/>`;
      bulbs += `<circle cx="${f2(bx)}" cy="${f2(by)}" r="${f2(br)}" fill="${c}"/>`;
    }
    s += `<g class="bulbs" style="animation-delay:${f2(-idx * .3)}s"><g filter="url(#glow)">${glow}</g>${bulbs}</g>`;
    // the sign on the nearest arch
    if (idx === zs.length - 1) {
      const top = baseY - ry - thick - 14, h = 32;
      s += `<rect x="410" y="${f2(top)}" width="280" height="${h}" rx="6" fill="#141430" stroke="#ffd60a" stroke-width="2.5"/>`;
      s += `<text x="550" y="${f2(top + 23)}" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="21" letter-spacing="5" fill="#ffd60a">MAIN STREET</text>`;
      for (let i = 0; i < 13; i++) s += `<circle cx="${f2(416 + i * 22.3)}" cy="${f2(i % 2 ? top + 4 : top + h - 4)}" r="2" fill="#fff3b0"/>`;
    }
  });
  $('#scene').innerHTML = s;
}

window.TacoNights = {
  step: dt => update(dt),
  startDay: n => startDay(n),
  addEarned: n => { dayEarned += n; money += n; },
  snapshot: () => ({ state, day, dayEarned, timeLeft, strikes, tokens, hand, stock: { ...stock },
    portions: portions.map(p => p && { t: +p.t.toFixed(2), state: p.state, kind: p.kind }),
    customers: customers.map(c => ({ name: c.name, order: c.order, patience: +c.patience.toFixed(2), slot: c.slot })) }),
};
})();
</script>
